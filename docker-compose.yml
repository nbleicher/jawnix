name: jawnix

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - batch_data:/srv/jawnix/batches
    - scraper_data:/data
  networks:
    - private

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jawnix}
      POSTGRES_USER: ${POSTGRES_USER:-jawnix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /var/lib/postgresql/data/pgdata/wal-archive && (test -f /var/lib/postgresql/data/pgdata/wal-archive/%f || cp %p /var/lib/postgresql/data/pgdata/wal-archive/%f)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/initdb/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jawnix} -d ${POSTGRES_DB:-jawnix}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - private

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    command: ["uvicorn", "jawnix.api:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--workers", "2"]

  worker:
    <<: *app
    command: ["python", "-m", "jawnix.worker"]
    environment:
      JAWNIX_WORKER_ID: worker-1
      JAWNIX_WORKER_LANE: maintenance
      JAWNIX_DATABASE_POOL_SIZE: "2"
      JAWNIX_DATABASE_MAX_OVERFLOW: "1"

  fulfillment-worker:
    <<: *app
    command: ["python", "-m", "jawnix.worker"]
    mem_limit: 2g
    cpus: 2
    environment:
      JAWNIX_WORKER_ID: fulfillment-worker-1
      JAWNIX_WORKER_LANE: fulfillment
      JAWNIX_DATABASE_POOL_SIZE: "2"
      JAWNIX_DATABASE_MAX_OVERFLOW: "1"

  notifications-worker:
    <<: *app
    command: ["python", "-m", "jawnix.worker"]
    mem_limit: 512m
    cpus: 1
    environment:
      JAWNIX_WORKER_ID: notifications-worker-1
      JAWNIX_WORKER_LANE: notifications
      JAWNIX_DATABASE_POOL_SIZE: "2"
      JAWNIX_DATABASE_MAX_OVERFLOW: "1"

  imports-worker:
    <<: *app
    command: ["python", "-m", "jawnix.worker"]
    mem_limit: 1g
    cpus: 2
    environment:
      JAWNIX_WORKER_ID: imports-worker-1
      JAWNIX_WORKER_LANE: imports
      JAWNIX_DATABASE_POOL_SIZE: "2"
      JAWNIX_DATABASE_MAX_OVERFLOW: "1"

  metrics-worker:
    <<: *app
    command: ["python", "-m", "jawnix.worker"]
    environment:
      JAWNIX_WORKER_ID: metrics-worker-1
      JAWNIX_WORKER_LANE: metrics

  scheduler:
    <<: *app
    command: ["python", "-m", "jawnix_data.scheduler"]

  keyword-worker:
    <<: *app
    command: ["python", "-m", "jawnix.keyword_worker", "--lane", "activate"]
    mem_limit: 512m
    cpus: 1
    environment:
      JAWNIX_DATABASE_POOL_SIZE: "2"
      JAWNIX_DATABASE_MAX_OVERFLOW: "1"

  keyword-refill-worker:
    <<: *app
    command: ["python", "-m", "jawnix.keyword_worker", "--lane", "refill"]
    mem_limit: 512m
    cpus: 1
    environment:
      JAWNIX_DATABASE_POOL_SIZE: "2"
      JAWNIX_DATABASE_MAX_OVERFLOW: "1"

  backup:
    <<: *app
    command: ["python", "-m", "jawnix_data.backup_scheduler"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-jawnix}
      PGUSER: ${POSTGRES_USER:-jawnix}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - batch_data:/srv/jawnix/batches:ro
      - postgres_data:/var/lib/postgresql/data
      - scraper_data:/data:ro
      - ${JAWNIX_BACKUP_EXPORT_DIR:-/srv/jawnix/backups}:/srv/jawnix/backups
      - ${JAWNIX_RESTIC_REPOSITORY_DIR:-/srv/jawnix/restic-repository}:/srv/jawnix/restic-repository

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      JAWNIX_DOMAIN: ${JAWNIX_DOMAIN:-jawnix.com}
      JAWNIX_SCRAPER_OPS_DOMAIN: ${JAWNIX_SCRAPER_OPS_DOMAIN:-scraper.jawnix.com}
      JAWNIX_PUBLIC_BASE_URL: ${JAWNIX_PUBLIC_BASE_URL:-https://jawnix.com}
      # Rendered into /config.js by the Caddyfile. Both are public by design.
      JAWNIX_SUPABASE_URL: ${JAWNIX_SUPABASE_URL:-}
      JAWNIX_SUPABASE_ANON_KEY: ${JAWNIX_SUPABASE_ANON_KEY:-}
      JAWNIX_BETTER_AUTH_UPSTREAM: ${JAWNIX_BETTER_AUTH_UPSTREAM:-jawnix-auth-pro-build-momentum.vercel.app}
      JAWNIX_SCRAPER_OPS_ORIGIN: ${JAWNIX_SCRAPER_OPS_ORIGIN:-}
      JAWNIX_ENABLE_BILLING: ${JAWNIX_ENABLE_BILLING:-false}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Static-page retirement (P8): the legacy customer/admin HTML pages are
      # gone; Caddy redirects their URLs to the React shell unconditionally, so
      # there is nothing left to mount into /srv/static.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private

volumes:
  postgres_data:
  batch_data:
  scraper_data:
  caddy_data:
  caddy_config:
networks:
  private:
    internal: false
