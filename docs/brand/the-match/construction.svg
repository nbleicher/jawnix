  <text x="296.0" y="90" fill="#0E1114" font-family="DM Sans, sans-serif" font-size="13">Wall 0.5M. Stroke 2.4. Evenodd cuts.</text><text x="296.0" y="112" fill="#0E1114" font-family="DM Sans, sans-serif" font-size="13">Word: DM Sans 600 opsz 40 · cap 56 · track −0.015em</text><text x="296.0" y="134" fill="#0E1114" font-family="DM Sans, sans-serif" font-size="13">Pairs: JA −0.02 · AW −0.055 · WN −0.02 · NI −0.055 · IX −0.03</text><text x="296.0" y="156" fill="#0E1114" font-family="DM Sans, sans-serif" font-size="13">Lockup gap plate→word = 28. Clear = one mark height.</text><text x="296.0" y="178" fill="#0E1114" font-family="DM Sans, sans-serif" font-size="13">One word. Do not open A–W into JA / WNIX.</text><text x="296.0" y="200" fill="#5C666C" font-family="DM Mono, monospace" font-size="11">Minima 24 mm print / 48 px screen — the plate, not live type.</text><text x="24" y="320" fill="#8B969E" font-family="DM Mono, monospace" font-size="11">Ticks at 5M and 8M keep the three chambers readable in one ink.</text>
