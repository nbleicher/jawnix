<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jawnix Admin</title><script src="/config.js"></script><link rel="stylesheet" href="/theme.css">
  <style>
    body{background:var(--bg);padding:28px}.shell{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab.active,.view-tab.active{background:var(--navy);color:white}.pane{display:none}.pane.active{display:block}.card{background:white;border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.states{color:var(--blue);font-size:12px}.status{text-transform:uppercase;font-size:11px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mapping{display:grid;grid-template-columns:1fr minmax(180px,300px) minmax(210px,auto);gap:12px;align-items:end}.mapping .actions{margin-top:0}.hierarchy{display:grid;gap:14px}.tree-group{background:#fff;border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;box-shadow:var(--shadow-sm)}.tree-group>summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:17px 18px;background:var(--recessed);font-weight:800;list-style:none}.tree-group>summary::-webkit-details-marker,.agent-node>summary::-webkit-details-marker{display:none}.tree-group>summary:before,.agent-node>summary:before{content:'›';display:inline-block;color:var(--muted);transition:transform .15s ease}.tree-group[open]>summary:before,.agent-node[open]>summary:before{transform:rotate(90deg)}.tree-title{display:flex;align-items:center;gap:10px;flex:1}.tree-count{color:var(--muted);font-size:12px;font-weight:600}.node-editor{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1fr) auto auto auto;gap:12px;align-items:end;padding:14px 18px;border-top:1px solid var(--border);background:#fff}.node-editor .field{margin:0}.check-field{display:flex;align-items:center;gap:8px;min-height:42px;font-size:12px;font-weight:700}.agent-list{padding:0 18px 16px 42px}.agent-node{border-left:2px solid var(--border);margin-top:12px;padding-left:14px}.agent-node>summary{cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 0;list-style:none}.agent-node .node-editor{padding:10px 0 12px;border:0;background:transparent}.recipient-leaf{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 8px 24px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--recessed)}.recipient-leaf .actions{margin:0}.slug{color:var(--muted);font-size:11px}.inactive{opacity:.65}.hierarchy-note{color:var(--muted);font-size:12px;margin:0}.view-switch{display:flex;gap:8px;flex-wrap:wrap}.badge-warn{background:var(--warning-soft);color:var(--warning)}@media(max-width:900px){.node-editor{grid-template-columns:1fr 1fr auto}.agent-list{padding-left:20px}.recipient-leaf{align-items:flex-start;flex-direction:column}}@media(max-width:700px){.mapping,.node-editor{grid-template-columns:1fr}.row{display:block}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><div class="logo">JAWN<span>IX</span></div><small>Batch administration — billing disabled</small></div><div class="actions"><button class="btn" id="sign-out">Sign out</button></div></header>
  <nav class="tabs"><button class="btn tab active" data-pane="requests">Requests</button><button class="btn tab" data-pane="recipients">Recipients</button><button class="btn tab" data-pane="customers">Create customer</button></nav>
  <section class="pane active" id="pane-requests"><div id="requests"><div class="msg-info">Loading requests…</div></div></section>
  <section class="pane" id="pane-recipients">
    <div class="card"><div class="row"><div><h2>Recipient organization</h2><p>Review agencies, agents, and their assigned customers. Slugs stay read-only to preserve distribution history.</p></div><div class="actions"><button class="btn" id="sync-recipients">Sync Supabase users</button><button class="btn" id="refresh-recipients">Refresh</button></div></div><div class="view-switch"><button class="btn view-tab active" data-recipient-view="hierarchy">Hierarchy</button><button class="btn view-tab" data-recipient-view="mappings">Mapping list</button></div></div>
    <div id="recipient-hierarchy"></div>
    <div id="recipient-mappings" hidden></div>
  </section>
  <section class="pane" id="pane-customers"><form class="card" id="customer-form"><h2>Create Supabase customer</h2><div class="grid"><div class="field"><label>Email</label><input id="customer-email" type="email" required></div><div class="field"><label>Password</label><input id="customer-password" type="password" minlength="8" required></div><div class="field"><label>First name</label><input id="customer-first"></div><div class="field"><label>Last name</label><input id="customer-last"></div></div><button class="btn btn-primary" type="submit">Create unmapped customer</button><div id="customer-message"></div></form></section>
</main>
<script>
function csrf(){return decodeURIComponent((document.cookie.split('; ').find(row=>row.startsWith('jawnix_csrf='))||'=').split('=')[1]);}
async function api(path,options={}){options.credentials='same-origin';options.headers={...(options.headers||{})};if(options.body)options.headers['Content-Type']='application/json';if(!['GET','HEAD'].includes(options.method||'GET'))options.headers['X-CSRF-Token']=csrf();const response=await fetch(path,options);if(response.status===401||response.status===403){location.replace('/login.html?next=/admin.html');throw new Error('Admin login required');}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'Request failed');return data;}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function loadRequests(){const items=await api('/api/admin/requests');document.getElementById('requests').innerHTML=items.length?items.map(item=>`<article class="card"><div class="row"><div><strong>${esc(item.customer)}</strong><div>${esc(item.email)} · ${esc(item.agent)}</div></div><span class="status">${esc(item.status.replaceAll('_',' '))}</span></div><h3>${Number(item.leadCount).toLocaleString()} rows</h3><div class="states">${item.states.map(esc).join(', ')}</div><p>${esc(item.statusMessage)}</p><div class="actions">${item.status==='pending'?`<button class="btn btn-primary" data-action="approve" data-id="${item.id}">Approve</button><button class="btn" data-action="reject" data-id="${item.id}">Reject</button>`:''}${item.status==='waiting_inventory'?`<button class="btn btn-primary" data-action="retry" data-id="${item.id}">Retry</button><button class="btn" data-action="reject" data-id="${item.id}">Reject</button>`:''}${item.status==='failed'?`<button class="btn btn-primary" data-action="${item.hasArtifact?'retry_delivery':'retry'}" data-id="${item.id}">${item.hasArtifact?'Retry delivery':'Retry generation'}</button>`:''}</div></article>`).join(''):'<div class="empty-state">No requests.</div>';document.querySelectorAll('[data-action]').forEach(button=>button.onclick=async()=>{button.disabled=true;try{await api(`/api/admin/requests/${button.dataset.id}/${button.dataset.action}`,{method:'POST'});await loadRequests();}catch(error){alert(error.message);button.disabled=false;}});}
function effectiveAgentActive(agent,data){const agency=data.agencies.find(item=>item.id===agent.agencyId);return agent.active&&(!agency||agency.active);}
function agentOptions(data,selectedId){return data.agents.map(agent=>{const active=effectiveAgentActive(agent,data);return `<option value="${agent.id}" ${agent.id===selectedId?'selected':''} ${!active&&agent.id!==selectedId?'disabled':''}>${esc(agent.name)}${agent.agency?' — '+esc(agent.agency):''}${active?'':' (inactive)'}</option>`;}).join('');}
function recipientLeaf(item){return `<div class="recipient-leaf"><div><strong>${esc(item.name||item.email)}</strong><div>${esc(item.email)}</div><div class="states">${item.states.map(esc).join(', ')||'No saved states'}</div></div><div class="actions"><span class="badge ${item.confirmed?'badge-ok':'badge-warn'}">${item.confirmed?'Confirmed':'Not confirmed'}</span><button class="btn btn-sm" data-activate="${item.userId}" data-email="${esc(item.email)}">Password reset</button></div></div>`;}
function agentEditor(agent,data){
  const recipients=data.recipients.filter(item=>item.agentId===agent.id);
  return `<details class="agent-node ${agent.active?'':'inactive'}" open data-agent-card="${agent.id}"><summary><div class="tree-title"><strong>${esc(agent.name)}</strong><span class="slug">${esc(agent.slug)}</span><span class="tree-count">${recipients.length} recipient${recipients.length===1?'':'s'}</span></div><span class="badge ${effectiveAgentActive(agent,data)?'badge-ok':'badge-void'}">${effectiveAgentActive(agent,data)?'Active':'Inactive'}</span></summary><div class="node-editor"><div class="field"><label>Agent name</label><input type="text" data-agent-name value="${esc(agent.name)}" maxlength="160"></div><div class="field"><label>Agency</label><select data-agent-agency data-original-agency="${agent.agencyId??''}"><option value="">Independent</option>${data.agencies.map(agency=>`<option value="${agency.id}" ${agency.id===agent.agencyId?'selected':''}>${esc(agency.name)}${agency.active?'':' (inactive)'}</option>`).join('')}</select></div><label class="check-field"><input type="checkbox" data-agent-active data-original-active="${agent.active}" ${agent.active?'checked':''}> Active agent</label><button class="btn btn-primary" data-save-agent="${agent.id}">Save agent</button><button class="btn btn-danger" data-delete-agent="${agent.id}" data-slug="${esc(agent.slug)}">Delete</button></div>${recipients.length?recipients.map(recipientLeaf).join(''):'<div class="recipient-leaf"><span class="hierarchy-note">No assigned recipients.</span></div>'}</details>`;
}
function renderHierarchy(data){
  const agencyGroups=data.agencies.map(agency=>{const agents=data.agents.filter(agent=>agent.agencyId===agency.id);const recipientCount=agents.reduce((count,agent)=>count+data.recipients.filter(item=>item.agentId===agent.id).length,0);return `<details class="tree-group ${agency.active?'':'inactive'}" open data-agency-card="${agency.id}"><summary><div class="tree-title"><strong>${esc(agency.name)}</strong><span class="slug">${esc(agency.slug)}</span><span class="tree-count">${agents.length} agents · ${recipientCount} recipients</span></div><span class="badge ${agency.active?'badge-ok':'badge-void'}">${agency.active?'Active':'Inactive'}</span></summary><div class="node-editor"><div class="field"><label>Agency name</label><input type="text" data-agency-name value="${esc(agency.name)}" maxlength="160"></div><div><p class="hierarchy-note">Slug: ${esc(agency.slug)}</p><p class="hierarchy-note">Disabling blocks new member requests.</p></div><label class="check-field"><input type="checkbox" data-agency-active data-original-active="${agency.active}" ${agency.active?'checked':''}> Active agency</label><button class="btn btn-primary" data-save-agency="${agency.id}">Save agency</button><button class="btn btn-danger" data-delete-agency="${agency.id}" data-slug="${esc(agency.slug)}">Delete</button></div><div class="agent-list">${agents.length?agents.map(agent=>agentEditor(agent,data)).join(''):'<div class="empty-state">No agents in this agency.</div>'}</div></details>`;}).join('');
  const independent=data.agents.filter(agent=>agent.agencyId===null);
  const unassigned=data.recipients.filter(item=>item.agentId===null);
  const independentGroup=`<details class="tree-group" open><summary><div class="tree-title"><strong>Independent agents</strong><span class="tree-count">${independent.length} agents</span></div></summary><div class="agent-list">${independent.length?independent.map(agent=>agentEditor(agent,data)).join(''):'<div class="empty-state">No independent agents.</div>'}</div></details>`;
  const unassignedGroup=`<details class="tree-group ${unassigned.length?'':'inactive'}" open><summary><div class="tree-title"><strong>Unassigned recipients</strong><span class="tree-count">${unassigned.length} recipients</span></div></summary><div class="agent-list">${unassigned.length?unassigned.map(recipientLeaf).join(''):'<div class="empty-state">Every recipient is assigned.</div>'}</div></details>`;
  document.getElementById('recipient-hierarchy').innerHTML=`<div class="hierarchy">${agencyGroups}${independentGroup}${unassignedGroup}</div>`;
}
function renderMappings(data){
  document.getElementById('recipient-mappings').innerHTML=data.recipients.map(item=>`<article class="card mapping"><div><strong>${esc(item.name||item.email)}</strong><div>${esc(item.email)}</div><div class="states">${item.states.map(esc).join(', ')||'No saved states'}</div><small>${item.confirmed?'Confirmed':'Not confirmed'}</small></div><div class="field"><label>Distribution agent</label><select data-agent="${item.userId}"><option value="">Select agent…</option>${agentOptions(data,item.agentId)}</select></div><div class="actions"><button class="btn btn-primary" data-map="${item.userId}">Save and confirm</button><button class="btn" data-activate="${item.userId}" data-email="${esc(item.email)}">Send password reset</button></div></article>`).join('');
}
function bindRecipientActions(){
  document.querySelectorAll('[data-map]').forEach(button=>button.onclick=async()=>{const agentId=Number(document.querySelector(`[data-agent="${button.dataset.map}"]`).value);if(!agentId)return alert('Select an active agent.');await api('/api/admin/recipients/'+button.dataset.map,{method:'PATCH',body:JSON.stringify({agent_id:agentId,confirmed:true})});await loadRecipients();});
  document.querySelectorAll('[data-activate]').forEach(button=>button.onclick=async()=>{if(!confirm(`Send a password setup/reset email to ${button.dataset.email}?`))return;button.disabled=true;try{const result=await api(`/api/admin/recipients/${button.dataset.activate}/send-password-reset`,{method:'POST'});alert(`Password reset sent to ${result.email}.`);}catch(error){alert(error.message);}finally{button.disabled=false;}});
  document.querySelectorAll('[data-save-agency]').forEach(button=>button.onclick=async()=>{const card=button.closest('[data-agency-card]'),active=card.querySelector('[data-agency-active]');if(active.dataset.originalActive==='true'&&!active.checked&&!confirm('Disabling this agency blocks new batch requests for every member agent. Continue?'))return;button.disabled=true;try{await api(`/api/admin/agencies/${button.dataset.saveAgency}`,{method:'PATCH',body:JSON.stringify({name:card.querySelector('[data-agency-name]').value,active:active.checked})});await loadRecipients();}catch(error){alert(error.message);button.disabled=false;}});
  document.querySelectorAll('[data-save-agent]').forEach(button=>button.onclick=async()=>{const card=button.closest('[data-agent-card]'),agencySelect=card.querySelector('[data-agent-agency]'),active=card.querySelector('[data-agent-active]'),agencyId=agencySelect.value?Number(agencySelect.value):null;if(String(agencyId??'')!==agencySelect.dataset.originalAgency&&!confirm('Changing agency membership changes shared permanent no-repeat history for future batches. Continue?'))return;if(active.dataset.originalActive==='true'&&!active.checked&&!confirm('Disabling this agent blocks new batch requests for assigned customers. Continue?'))return;button.disabled=true;try{await api(`/api/admin/agents/${button.dataset.saveAgent}`,{method:'PATCH',body:JSON.stringify({name:card.querySelector('[data-agent-name]').value,agency_id:agencyId,active:active.checked})});await loadRecipients();}catch(error){alert(error.message);button.disabled=false;}});
  document.querySelectorAll('[data-delete-agent]').forEach(button=>button.onclick=async()=>{const slug=button.dataset.slug,confirmation=prompt(`Delete agent ${slug}? This removes the agent from the active hierarchy, unassigns customers, and preserves distribution history. Type ${slug} to confirm.`);if(confirmation===null)return;button.disabled=true;try{const result=await api(`/api/admin/agents/${button.dataset.deleteAgent}`,{method:'DELETE',body:JSON.stringify({confirm_slug:confirmation})});alert(`Agent deleted. ${result.unassignedRecipients} recipient(s) now require remapping; distribution history was preserved.`);await loadRecipients();}catch(error){alert(error.message);button.disabled=false;}});
  document.querySelectorAll('[data-delete-agency]').forEach(button=>button.onclick=async()=>{const slug=button.dataset.slug,confirmation=prompt(`Delete agency ${slug} and every member agent? Customers will be unassigned and all distribution history will be retained. Type ${slug} to confirm.`);if(confirmation===null)return;button.disabled=true;try{const result=await api(`/api/admin/agencies/${button.dataset.deleteAgency}`,{method:'DELETE',body:JSON.stringify({confirm_slug:confirmation})});alert(`Agency deleted with ${result.deletedAgents} agent(s). ${result.unassignedRecipients} recipient(s) now require remapping; distribution history was preserved.`);await loadRecipients();}catch(error){alert(error.message);button.disabled=false;}});
}
async function loadRecipients(){const data=await api('/api/admin/recipients');renderHierarchy(data);renderMappings(data);bindRecipientActions();}
function setRecipientView(view){document.querySelectorAll('[data-recipient-view]').forEach(button=>button.classList.toggle('active',button.dataset.recipientView===view));document.getElementById('recipient-hierarchy').hidden=view!=='hierarchy';document.getElementById('recipient-mappings').hidden=view!=='mappings';}
document.querySelectorAll('[data-recipient-view]').forEach(button=>button.onclick=()=>setRecipientView(button.dataset.recipientView));
document.querySelectorAll('[data-pane]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-pane]').forEach(b=>b.classList.toggle('active',b===button));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+button.dataset.pane));if(button.dataset.pane==='recipients')loadRecipients();});document.getElementById('refresh-recipients').onclick=loadRecipients;
document.getElementById('sync-recipients').onclick=async()=>{const result=await api('/api/admin/recipients/sync',{method:'POST'});alert(`Synced ${result.seen} customers; ${result.proposedMappings} mappings proposed. Confirm every mapping before enabling requests.`);await loadRecipients();};
document.getElementById('customer-form').onsubmit=async event=>{event.preventDefault();try{await api('/api/admin/customers',{method:'POST',body:JSON.stringify({email:document.getElementById('customer-email').value,first_name:document.getElementById('customer-first').value,last_name:document.getElementById('customer-last').value,password:document.getElementById('customer-password').value})});document.getElementById('customer-message').innerHTML='<div class="msg-ok">Customer created. Confirm their agent mapping before enabling requests.</div>';event.target.reset();}catch(error){document.getElementById('customer-message').innerHTML=`<div class="msg-err">${esc(error.message)}</div>`;}};
document.getElementById('sign-out').onclick=async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location.assign('/login.html');};loadRequests().catch(error=>alert(error.message));
</script></body></html>
