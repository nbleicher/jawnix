services:
  serve:
    image: ghcr.io/gosom/google-maps-scraper-saas:latest
    platform: linux/arm64
    command: serve
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADDR: ":8080"
      DB_MAX_CONNS: "10"
      DB_MIN_CONNS: "2"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    image: ghcr.io/gosom/google-maps-scraper-saas:latest
    platform: linux/arm64
    command: worker
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CONCURRENCY: ${CONCURRENCY:-4}
      FAST_MODE: ${FAST_MODE:-true}
      MAX_JOBS_PER_CYCLE: ${MAX_JOBS_PER_CYCLE:-100}
      PROXIES: ${PROXIES:-}
    depends_on:
      serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
