{% if generated %}<div class="notice success"><i data-lucide="file-check-2"></i><span>{{ generated }} regenerated</span></div>{% endif %}
<div class="export-grid">{% for file in exports %}<article class="export-card"><span class="file-icon"><i data-lucide="file-spreadsheet"></i></span><div><strong>{{ file.name }}</strong><small>{{ "{:.1f}".format(file.size / 1024) }} KB</small></div><div class="export-actions">{% set code = file.name.split('.')[0].lower() %}<button class="icon-button" hx-post="/database/export/{{ code }}" hx-target="#export-files" title="Regenerate {{ file.name }}" aria-label="Regenerate {{ file.name }}"><i data-lucide="refresh-cw"></i></button><a class="icon-button" href="/database/download/{{ file.name }}" title="Download {{ file.name }}" aria-label="Download {{ file.name }}"><i data-lucide="download"></i></a></div></article>{% else %}<div class="empty-state"><i data-lucide="folder-open"></i><p>No CSV exports</p></div>{% endfor %}</div>
