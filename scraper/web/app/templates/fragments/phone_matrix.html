<div class="matrix-wrap"><table><thead><tr><th>State</th><th>Keyword</th><th>Unique phones</th></tr></thead><tbody>{% for row in matrix %}<tr><td><span class="state-code small">{{ row.state }}</span></td><td>{{ row.keyword }}</td><td>{{ "{:,}".format(row.phones) }}</td></tr>{% else %}<tr><td colspan="3" class="table-empty">No phone data</td></tr>{% endfor %}</tbody><tfoot>{% for state, total in matrix_totals.items() %}<tr><td>{{ state }}</td><td>Total</td><td>{{ "{:,}".format(total) }}</td></tr>{% endfor %}</tfoot></table></div>
