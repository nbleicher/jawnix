<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>JAWNIX</title>
    <script>
      (function () {
        var scheme = "light";
        try {
          if (localStorage.getItem("jx-match-scheme") === "dark") scheme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", "match");
        document.documentElement.setAttribute("data-scheme", scheme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- vite-ignore: generated and served by the deployment edge, not bundled -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
